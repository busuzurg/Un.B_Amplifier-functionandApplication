<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Circuit Simulator & Signal Analyzer</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text: #e0e0e0;
            --vplus: #2ecc71;  
            --vminus: #3498db; 
            --vout: #e74c3c;   
            --border: #333;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text); 
            padding: 15px; 
            overflow-x: hidden; 
        }
        
        .header { text-align: center; padding: 10px 0; border-bottom: 2px solid var(--border); margin-bottom: 20px;}
        .header h2 { font-size: 1.5rem; margin: 0; }
        
        .container { display: grid; grid-template-columns: 380px 1fr; gap: 20px; max-width: 1500px; margin: 0 auto; }
        
        .panel { background-color: var(--bg-panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1.1em;}
        
        .control-group { margin-bottom: 15px; width: 100%; }
        label { display: block; margin-bottom: 5px; font-size: 0.85em; color: #aaa; }
        select, input[type="number"], input[type="range"] { width: 100%; padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 15px; }
        
        .code-editor { font-family: monospace; width: 100%; height: 60px; background: #000; color: #0f0; border: 1px solid #555; padding: 10px; resize: vertical; font-size: 14px;}
        
        .btn { padding: 10px 15px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1em; }
        .btn-play { background: #27ae60; }
        .btn-play:hover { background: #2ecc71; }
        
        canvas { width: 100%; height: 400px; background-color: #000; border-radius: 8px; border: 2px solid #444; display: block; }
        
        .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 0.9em;}
        .color-box { width: 15px; height: 15px; border-radius: 3px; }

        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; min-width: 80px; }

        .live-viewer { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; flex-wrap: wrap;}
        .stat-box { background: #111; padding: 15px; border-radius: 6px; border-left: 5px solid; flex: 1 1 200px; display: flex; flex-direction: column; justify-content: center; }
        .stat-label { font-size: 0.75em; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: bold;}
        .stat-main { font-size: 1.1em; font-weight: bold; color: #fff; margin-bottom: 2px;}
        .stat-sub { font-size: 0.85em; color: #aaa; }

        /* MOBILE RESPONSIVENESS FIXES */
        @media (max-width: 950px) {
            body { padding: 10px; }
            .container { grid-template-columns: 1fr; gap: 15px; } 
            .panel { padding: 15px; }
            canvas { height: 280px; }
            .header h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ Circuit Simulator & Analyzer</h2>
    </div>

    <div class="container">
        <!-- LEFT PANEL: CONTROLS -->
        <div class="panel">
            <h3>1. Circuit Selection</h3>
            <div class="control-group">
                <select id="circuitType" onchange="resetSim()">
                    <option value="comparator">Basic Comparator (Digital Output)</option>
                    <option value="schmitt">Inverting Schmitt Trigger (Hysteresis)</option>
                    <option value="opamp_diff">Op-Amp Diff Amplifier (Linear)</option>
                    <option value="integrator">Op-Amp Integrator (Accumulates area)</option>
                    <option value="differentiator">Op-Amp Differentiator (Rate of change)</option>
                </select>
            </div>

            <!-- FIXED GAP FOR BUTTONS AND TIME INPUT -->
            <div class="control-group" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-play" onclick="togglePlay()" id="playBtn" style="min-width: 80px;">Pause</button>
                    <button class="btn" onclick="resetSim()" style="background:#555; min-width: 80px;">Reset</button>
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>Set Init Time (t)</label>
                    <input type="number" id="initialTime" value="0" step="0.1" onchange="setTime()">
                </div>
            </div>

            <hr style="border-color: #333; margin: 20px 0;">

            <h3>2. V+ Non-Inverting <span style="color:var(--vplus)">■</span></h3>
            <div class="control-group">
                <select id="vPlusType">
                    <option value="sine">Sine Wave</option>
                    <option value="square">Square Wave</option>
                    <option value="triangle">Triangle Wave</option>
                    <option value="dc">Constant DC</option>
                    <option value="custom">Manual Code (JS)</option>
                </select>
            </div>
            <div class="control-group flex-row">
                <div><label>Amp (V)</label><input type="number" id="vPlusAmp" value="5" step="0.5"></div>
                <div><label>Freq (Hz)</label><input type="number" id="vPlusFreq" value="1" step="0.1"></div>
                <div><label>Phase (°)</label><input type="number" id="vPlusPhase" value="0" step="15"></div>
            </div>
            <div class="control-group">
                <label>DC Offset / Constant Voltage</label>
                <input type="range" id="vPlusDC" min="-15" max="15" value="0" step="0.5" oninput="document.getElementById('vPlusDCVal').innerText = this.value + 'V'">
                <span id="vPlusDCVal" style="font-size:0.8em; color:#aaa; display:block; text-align:right;">0V</span>
            </div>
            <div class="control-group">
                <label>Custom JS Code</label>
                <textarea class="code-editor" id="vPlusCode">Math.sin(t * 3) * 5</textarea>
            </div>

            <hr style="border-color: #333; margin: 20px 0;">

            <h3>3. V- Inverting <span style="color:var(--vminus)">■</span></h3>
            <div class="control-group">
                <select id="vMinusType">
                    <option value="dc">Constant DC</option>
                    <option value="sine">Sine Wave</option>
                    <option value="square">Square Wave</option>
                    <option value="triangle">Triangle Wave</option>
                    <option value="custom">Manual Code (JS)</option>
                </select>
            </div>
            <div class="control-group flex-row">
                <div><label>Amp (V)</label><input type="number" id="vMinusAmp" value="5" step="0.5"></div>
                <div><label>Freq (Hz)</label><input type="number" id="vMinusFreq" value="1" step="0.1"></div>
                <div><label>Phase (°)</label><input type="number" id="vMinusPhase" value="0" step="15"></div>
            </div>
            <div class="control-group">
                <label>DC Offset / Constant Voltage</label>
                <input type="range" id="vMinusDC" min="-15" max="15" value="0" step="0.5" oninput="document.getElementById('vMinusDCVal').innerText = this.value + 'V'">
                <span id="vMinusDCVal" style="font-size:0.8em; color:#aaa; display:block; text-align:right;">0V</span>
            </div>
            <div class="control-group">
                <label>Custom JS Code</label>
                <textarea class="code-editor" id="vMinusCode">Math.cos(t * 2) * 5</textarea>
            </div>
        </div>

        <!-- RIGHT PANEL: OSCILLOSCOPE -->
        <div class="panel">
            <h3 style="text-align: center;">Live Oscilloscope</h3>
            <canvas id="oscCanvas"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background:var(--vplus);"></div> V+ Input</div>
                <div class="legend-item"><div class="color-box" style="background:var(--vminus);"></div> V- Input</div>
                <div class="legend-item"><div class="color-box" style="background:var(--vout);"></div> V_out Output</div>
            </div>

            <!-- LIVE SIGNAL ANALYZER -->
            <div class="live-viewer">
                <div class="stat-box" style="border-color: var(--vplus);">
                    <div class="stat-label">V+ (Non-Inv) Analysis</div>
                    <div class="stat-main" id="statVplusMain">Waiting...</div>
                    <div class="stat-sub" id="statVplusSub">-</div>
                </div>
                <div class="stat-box" style="border-color: var(--vminus);">
                    <div class="stat-label">V- (Inv) Analysis</div>
                    <div class="stat-main" id="statVminusMain">Waiting...</div>
                    <div class="stat-sub" id="statVminusSub">-</div>
                </div>
                <div class="stat-box" style="border-color: var(--vout);">
                    <div class="stat-label">V_out Analysis</div>
                    <div class="stat-main" id="statVoutMain">Waiting...</div>
                    <div class="stat-sub" id="statVoutSub">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let t = 0;
        let isPlaying = true;
        let history = [];
        const MAX_POINTS = 300; 
        const DT = 0.02; 
        const V_SAT = 14; 
        
        let integratedValue = 0;
        let prevDiff = 0;
        let currentVout = 0;

        const canvas = document.getElementById('oscCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        function resizeCanvas() {
            w = canvas.clientWidth;
            h = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "Pause" : "Play";
            document.getElementById('playBtn').className = isPlaying ? "btn btn-pause" : "btn btn-play";
            if(isPlaying) requestAnimationFrame(loop);
        }

        function setTime() {
            t = parseFloat(document.getElementById('initialTime').value) || 0;
            resetSimState();
        }

        function resetSimState() {
            history = [];
            integratedValue = 0;
            prevDiff = 0;
            currentVout = 0;
            for(let i=0; i<MAX_POINTS; i++) history.push({vp:0, vm:0, vout:0}); 
        }

        function resetSim() {
            t = 0;
            document.getElementById('initialTime').value = 0;
            resetSimState();
        }

        function getSignal(type, amp, freq, phaseDeg, dc, customCode, time) {
            amp = parseFloat(amp); 
            freq = parseFloat(freq); 
            dc = parseFloat(dc);
            let phaseRad = parseFloat(phaseDeg) * (Math.PI / 180);
            let currentPhase = (time * freq * Math.PI * 2) + phaseRad;

            switch(type) {
                case 'dc': return dc;
                case 'sine': return dc + amp * Math.sin(currentPhase);
                case 'square': return dc + amp * Math.sign(Math.sin(currentPhase));
                case 'triangle': return dc + amp * (2/Math.PI) * Math.asin(Math.sin(currentPhase));
                case 'custom':
                    try {
                        const fn = new Function('t', 'return ' + customCode);
                        return fn(time);
                    } catch(e) { return 0; }
            }
        }

        function updatePhysics() {
            const vPlus = getSignal(
                document.getElementById('vPlusType').value,
                document.getElementById('vPlusAmp').value,
                document.getElementById('vPlusFreq').value,
                document.getElementById('vPlusPhase').value, 
                document.getElementById('vPlusDC').value,
                document.getElementById('vPlusCode').value, t
            );

            const vMinus = getSignal(
                document.getElementById('vMinusType').value,
                document.getElementById('vMinusAmp').value,
                document.getElementById('vMinusFreq').value,
                document.getElementById('vMinusPhase').value,
                document.getElementById('vMinusDC').value,
                document.getElementById('vMinusCode').value, t
            );

            const circuit = document.getElementById('circuitType').value;
            let vOut = 0;

            if (circuit === 'comparator') {
                vOut = (vPlus > vMinus) ? V_SAT : -V_SAT;
            } else if (circuit === 'schmitt') {
                const feedbackRatio = 0.3; 
                let threshold = vPlus + (currentVout * feedbackRatio);
                if (vMinus > threshold) currentVout = -V_SAT;
                else if (vMinus < threshold) currentVout = V_SAT;
                vOut = currentVout;
            } else if (circuit === 'opamp_diff') {
                vOut = (vPlus - vMinus) * 2;
            } else if (circuit === 'integrator') {
                const rcTimeConstant = 0.5;
                integratedValue += ((vPlus - vMinus) / rcTimeConstant) * DT;
                integratedValue *= 0.999; 
                vOut = integratedValue;
            } else if (circuit === 'differentiator') {
                const diff = vPlus - vMinus;
                const rcTimeConstant = 0.1; 
                vOut = ((diff - prevDiff) / DT) * rcTimeConstant;
                prevDiff = diff;
            }

            vOut = Math.max(-V_SAT, Math.min(V_SAT, vOut));

            history.push({ vp: vPlus, vm: vMinus, vout: vOut });
            if (history.length > MAX_POINTS) history.shift();
            t += DT;
        }

        function analyzeSignal(key) {
            if (history.length < 10) return { main: "Waiting...", sub: "" };
            let maxV = -Infinity, minV = Infinity, sumV = 0;
            for (let i = 0; i < history.length; i++) {
                let v = history[i][key];
                if (v > maxV) maxV = v;
                if (v < minV) minV = v;
                sumV += v;
            }
            let peakToPeak = maxV - minV;
            let dcOffset = sumV / history.length;

            if (peakToPeak < 0.2) return { main: "Constant DC", sub: `Level: ${dcOffset.toFixed(2)}V` };

            let sumSqAc = 0, turnarounds = 0;
            for (let i = 1; i < history.length - 1; i++) {
                let vAc = history[i][key] - dcOffset;
                sumSqAc += vAc * vAc;
                let prevSlope = history[i][key] - history[i-1][key];
                let nextSlope = history[i+1][key] - history[i][key];
                if (prevSlope * nextSlope < 0 && Math.abs(prevSlope) > 0.05) turnarounds++;
            }

            let acRms = Math.sqrt(sumSqAc / (history.length - 2));
            let amplitude = peakToPeak / 2;
            let crestFactor = amplitude / (acRms === 0 ? 1 : acRms);
            
            let shape = "Complex Wave";
            if (crestFactor < 1.25) shape = "Square Wave";
            else if (crestFactor >= 1.25 && crestFactor < 1.55) shape = "Sine Wave";
            else if (crestFactor >= 1.55 && crestFactor < 1.85) shape = "Triangle Wave";
            else if (crestFactor >= 1.85) shape = "Spiked/Pulse";

            let quality = "Pure Signal";
            if (turnarounds > 25) quality = "Noisy/Scattered";
            else if (turnarounds > 12) quality = "High Freq";

            return { main: `AC ${shape}`, sub: `${quality} | ${peakToPeak.toFixed(1)}V P-P` };
        }

        function updateLiveStats() {
            const statP = analyzeSignal('vp');
            document.getElementById('statVplusMain').innerText = statP.main;
            document.getElementById('statVplusSub').innerText = statP.sub;

            const statM = analyzeSignal('vm');
            document.getElementById('statVminusMain').innerText = statM.main;
            document.getElementById('statVminusSub').innerText = statM.sub;

            const statO = analyzeSignal('vout');
            document.getElementById('statVoutMain').innerText = statO.main;
            document.getElementById('statVoutSub').innerText = statO.sub;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, w, h);
            ctx.lineWidth = 1;
            
            for(let i=0; i<10; i++) {
                ctx.strokeStyle = i === 5 ? '#555' : '#222'; 
                ctx.beginPath();
                ctx.moveTo(0, i * (h/10));
                ctx.lineTo(w, i * (h/10));
                ctx.stroke();
            }
            
            ctx.fillStyle = '#888';
            ctx.font = '11px sans-serif';
            ctx.fillText("+15V", 5, 12);
            ctx.fillText("0V", 5, h/2 - 4);
            ctx.fillText("-15V", 5, h - 4);
        }

        function drawWaveform(key, color, thickness) {
            if(history.length === 0) return;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = thickness;
            ctx.beginPath();
            
            for (let i = 0; i < history.length; i++) {
                const x = (i / MAX_POINTS) * w;
                const voltage = history[i][key];
                const y = (h / 2) - (voltage / 15) * (h / 2);
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function loop() {
            if(isPlaying) {
                updatePhysics();
                drawGrid();
                
                drawWaveform('vm', '#3498db', 2); 
                drawWaveform('vp', '#2ecc71', 2); 
                drawWaveform('vout', '#e74c3c', 3); 
                
                updateLiveStats();
                
                requestAnimationFrame(loop);
            }
        }

        resetSimState();
        loop();
    </script>
</body>
</html>
